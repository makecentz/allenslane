<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4efe5;color:#24332f;font-family:Arial,sans-serif">
    <div style="max-width:600px;margin:0 auto;padding:40px 24px">
      <div style="background:#ffffff;border-top:8px solid #a7332b;padding:32px">
        <p style="margin:0 0 10px;color:#8d2c26;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase">Allens Lane Art Center</p>
        <h1 style="margin:0 0 18px;font-size:28px;color:#263d37">Reset your password</h1>
        <p style="line-height:1.6">We received a password-reset request for {{ .Email }}.</p>
        <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#263d37;color:#ffffff;padding:13px 20px;text-decoration:none;font-weight:700">Choose a new password</a></p>
        <p style="color:#6a716d;font-size:13px;line-height:1.5">If you did not request this change, do not use the link and contact Allens Lane Art Center.</p>
      </div>
    </div>
  </body>
</html>
